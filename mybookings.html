<!-- MY BOOKINGS PAGE -->
<div id="bookings" class="page active">

<section class="container section-pad">

Your saved booking requests will appear here.
</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

// Current year
document.getElementById('year').textContent =
  new Date().getFullYear();

// DISPLAY BOOKINGS
function displayBookings() {
  const list = document.getElementById('bookingList');
  const empty = document.getElementById('emptyBookings');

  list.innerHTML = '';

  const bookings = JSON.parse(
    localStorage.getItem('SRSBookings') || '[]'
  );

  empty.classList.toggle('d-none', bookings.length > 0);

  bookings.slice().reverse().forEach(function(booking) {
    const col = document.createElement('div');
    col.className = 'col-md-6 col-lg-4';

    const card = document.createElement('div');
    card.className = 'booking-card';

    const title = document.createElement('h3');
    title.textContent = booking.name;
    card.appendChild(title);

    const details = [
      ['Email', booking.email],
      ['Phone', booking.phone],
      ['Guests', booking.guests],
      ['Date', booking.date],
      ['Time', booking.time],
      ['Request', booking.notes || 'None']
    ];

    details.forEach(function(detail) {
      const p = document.createElement('p');
      const strong = document.createElement('strong');

      strong.textContent = detail[0] + ': ';
      p.appendChild(strong);
      p.appendChild(document.createTextNode(detail[1]));

      card.appendChild(p);
    });

    const deleteButton = document.createElement('button');
    deleteButton.className =
      'btn btn-outline-secondary mt-3';
    deleteButton.textContent = 'Delete Booking';

    deleteButton.addEventListener('click', function() {
      const updated = bookings.filter(function(item) {
        return item.id !== booking.id;
      });

      localStorage.setItem(
        'SRSBookings',
        JSON.stringify(updated)
      );

      displayBookings();
    });

    card.appendChild(deleteButton);
    col.appendChild(card);
    list.appendChild(col);
  });
}

displayBookings();

</script>
